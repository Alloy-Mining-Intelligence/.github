# Build and test on every pull request.
#
# ⚠️ EVERY `uses:` MUST STAY PINNED TO A FULL 40-CHARACTER COMMIT SHA, with the release named in a
# trailing comment. The org Actions policy sets `sha_pinning_required: true`, and a moving tag such as
# `@v7` does not fail a step — THE RUN NEVER STARTS. It is recorded as `startup_failure` with no log
# output and no error naming the policy, which reads exactly like a GitHub outage or malformed YAML.
#
# ✅ Resolve a SHA over git, which needs no token:
#      git ls-remote --tags https://github.com/actions/checkout | grep 'refs/tags/v7.0.1$'
# ✅ Let Dependabot maintain these pins — the `github-actions` ecosystem updates the SHA and rewrites
#    the version comment with it. See templates/dependabot.yml in the .github repo.
#
# Customise: the Python version, the dependency install, and the lint/test commands. Delete the
# `image` job if this repository has no Dockerfile.
#
# ✅ FIRST RUN ON A REAL REPO: MillWatch-POC PR #3, 2026-08-17 (INF-286). Both jobs green. Before
# that this template had never executed anywhere — it was valid YAML that nobody had proved runs.
# Five things were wrong, every one of them invisible to inspection. They are fixed below and each
# is marked `⚠️ INF-286`. If you are about to "simplify" one of those comments away, it was written
# because the failure it describes actually happened.

name: CI

on:
  pull_request:
  # ⚠️ INF-286: `$default-branch` is expanded ONLY when this template is copied through the
  # Actions → New workflow UI. Committed by any other route — API, git push, a copy-paste — it stays
  # literally `$default-branch`, matches no branch, and the push trigger silently never fires.
  # The `pull_request:` trigger above still works, so CI looks alive on PRs while main is unguarded.
  # ✅ If you did not use the UI, replace this with your real default branch name.
  push:
    branches: [ $default-branch ]

# Least privilege. The org default is already read-only; stating it here means a change to that
# default cannot silently widen this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️ INF-286: MATCH THE RUNTIME THIS REPO ACTUALLY SHIPS, don't keep 3.13 because it is here.
      # MillWatch-POC's Dockerfile is `python:3.11-slim`, so testing on 3.13 would have exercised an
      # interpreter the image never runs — a gap that surfaces in production, not in CI.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      # ⚠️ INF-286: lint and test tooling belongs in `requirements-dev.txt`, NOT `requirements.txt`.
      # A Dockerfile that does `pip install -r requirements.txt` will otherwise ship ruff and pytest
      # inside the runtime image. Create `requirements-dev.txt` when you adopt this template —
      # this step fails if it is missing, which is deliberate and better than silently skipping it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ⚠️ INF-286: on an existing codebase `ruff check .` with default rules is red on day one —
      # 61 findings on MillWatch-POC, essentially all style. CI that fails from the first commit
      # teaches everyone to ignore the red tick, which costs more than the style gains.
      # ✅ Set a real-error baseline in `pyproject.toml` and widen it deliberately:
      #      [tool.ruff.lint]
      #      select = ["E9", "F"]     # syntax/IO errors + pyflakes: undefined and unused names
      - name: Lint
        run: ruff check .

      # ⚠️ INF-286: `pytest` exits 5 when it collects ZERO tests, which fails this step. "pytest is
      # installed" is not enough — the repo needs at least one real test before this goes green.
      - name: Test
        run: pytest --junitxml=test-results.xml

      # `if: always()` so a failing test run still uploads the report that explains why.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn

  # Delete this job if the repository has no Dockerfile.
  #
  # Plain `docker build` rather than a build-push action: the image is only proved to build here, it is
  # never pushed, so the action buys nothing and adds a third-party dependency to keep pinned.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⚠️⚠️ INF-286: THE TAG MUST BE LOWERCASED. Docker requires lowercase repository names, and
      # GitHub repo names are mixed case — `MillWatch-POC` produced:
      #     ERROR: failed to build: invalid tag "MillWatch-POC:<sha>":
      #            repository name must be lowercase
      # It fails at TAG VALIDATION, before a single layer is built, so the Dockerfile can be entirely
      # correct and the job still dies. ⚠️ This survived both inspection AND local testing — a human
      # running `docker build --tag myapp:test .` by hand types the tag lowercase without thinking.
      # Only a real run, on a repo whose real name has capitals, finds it.
      - name: Build image
        run: |
          name=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')
          docker build --tag "${name}:${GITHUB_SHA}" .
