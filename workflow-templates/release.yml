# Tag-driven release: re-test the tagged commit, then publish a GitHub release from it.
#
# ⚠️ EVERY `uses:` MUST STAY PINNED TO A FULL 40-CHARACTER COMMIT SHA, with the release named in a
# trailing comment. See the note at the top of ci.yml for what a moving tag actually does — it is not
# a failed step, it is a run that never starts.
#
# Customise the build and the artefact list. Trigger with an annotated tag:
#     git tag -s v1.2.3 -m 'v1.2.3' && git push origin v1.2.3
#
# ⚠️⚠️ INF-286: THIS TEMPLATE DEFAULTS TO AN APPLICATION RELEASE — tag, re-test, publish notes. It
# does NOT build a wheel.
#
# It used to. `python -m build` and an upload with `if-no-files-found: error` were unconditional,
# which assumed every repo here is a distributable Python package. **Not one is.** Every Python repo
# in this org is an application that runs from a checkout or a container image:
#
#   MillWatch-POC             app  — Dockerfile + requirements.txt, no [project] table
#   Alloy.Edge.Pi.Connector   app  — Dockerfile only
#   alloy-mining-platform     no Python packaging
#   alloymining.ai            no Python packaging
#   alloy-mining-infra        no Python packaging
#
# On any of them the old default failed at `python -m build`, or produced no `dist/` and then failed
# the upload. A template whose default path cannot run on a single repo in the org is not a default.
#
# ✅ IF THIS REPO REALLY DOES SHIP A WHEEL, restore the two steps marked `PACKAGE RELEASE ONLY`
# below and add `dist/*` back to the `gh release create` argument list. They need a `[project]`
# table and a build backend in `pyproject.toml` first — a pyproject holding only tool config
# (`[tool.ruff]`, `[tool.pytest.ini_options]`) does NOT make a repo buildable, and `python -m build`
# fails on it.

name: Release

on:
  push:
    tags: ["v*"]

# `contents: write` is what lets `gh release create` publish. The org default is read-only, so this
# elevation is per-workflow and deliberate — do not widen it further.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so --generate-notes can see history back to the previous tag. With the default
      # shallow clone the generated notes come out empty rather than failing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      # ⚠️ INF-286: `pytest` runs below but was never installed — it is dev tooling, and installing it
      # from `requirements.txt` would ship a test runner inside any image built from that file.
      # Same correction as ci.yml. ✅ PROVEN ON A REAL RUN, no longer inspection alone: MillWatch-POC
      # run 32074473075, 2026-08-17, installed from both files and succeeded (INF-286 criterion 3).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Never publish a release from a commit that has not passed its own tests. The tag may point at
      # a commit CI never ran on.
      # ⚠️ INF-286: `pytest` exits 5 on zero collected tests, so this step fails on a repo with no
      # tests — here that is correct behaviour, since it blocks the release rather than the PR.
      - name: Test
        run: pytest

      # ---------------------------------------------------------------------------------------------
      # PACKAGE RELEASE ONLY — both steps below are commented out on purpose. See the header.
      # Uncomment BOTH, and add `dist/*` to `gh release create`, only if this repo builds a wheel.
      # Requires a `[project]` table and a build backend in pyproject.toml.
      #
      # - name: Build distributables
      #   run: |
      #     python -m pip install --upgrade build
      #     python -m build
      #
      # - name: Upload build artefacts
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      #   with:
      #     name: dist
      #     path: dist/
      #     if-no-files-found: error     # error, not warn: a package release with no wheel is a bug
      # ---------------------------------------------------------------------------------------------

      # `gh` is preinstalled on GitHub-hosted runners, so this needs no third-party action to keep
      # pinned. `--verify-tag` refuses to invent a tag if the ref is somehow missing.
      #
      # ⚠️ INF-286: no file arguments. `gh release create` publishes notes-only when given none —
      # passing `dist/*` with no `dist/` directory makes the shell hand `gh` a literal `dist/*`,
      # which fails as a missing asset. Add the glob back only alongside the build steps above.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
